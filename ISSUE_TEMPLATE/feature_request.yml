name: Idea or request
description: Suggest a change or something new.
labels: ["enhancement"]
body:
  - type: textarea
    id: goal
    attributes:
      label: What you're trying to do
      description: Describe the problem or goal behind the request.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: What you'd suggest
      description: Describe the change you have in mind, if you have one.
    validations:
      required: false
