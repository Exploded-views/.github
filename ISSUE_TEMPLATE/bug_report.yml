name: Bug report
description: Something isn't working the way it should.
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe what you saw, including any error messages.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: Describe what you thought would happen instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the steps that lead to the problem.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The release, tag, or commit SHA you were using.
    validations:
      required: false
